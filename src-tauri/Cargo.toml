[package]
name = "imagesage"
version = "0.6.0"
description = "Generate images with OpenAI and refine them one region at a time"
authors = ["Rob Mirabelle"]
edition = "2021"

[lib]
name = "imagesage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
keyring = { version = "3", features = ["windows-native"] }
ort = { version = "=2.0.0-rc.13", features = ["directml"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

# Dependencies (image resizing, PNG encoding) are optimized in dev builds too, so local AI masks are fast while testing.
[profile.dev.package."*"]
opt-level = 2
